name: Bug report
description: Report a reproducible issue in RLSOK ReleaseGate.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an RLSOK issue. Do not include secrets or imply that a Release OK result certifies robot motion safety.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Public release tag or commit hash.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - ExecSpec / schemas
        - Release approval or revocation
        - Execution Gate
        - Evidence
        - CLI
        - Headless daemon
        - ROS 2 interface contract
        - Optional Lab
        - Reference ESP32 adapter
        - Compatibility layer
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Include the command, sanitized input identities, expected gate result, and actual result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Security boundary
      options:
        - label: I have removed credentials, private endpoints, and sensitive evidence.
          required: true
        - label: I understand RLSOK is not a functional-safety certification.
          required: true
