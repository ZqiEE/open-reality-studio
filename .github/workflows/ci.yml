name: RLSOK core

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_source_sha="$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$actual_source_sha" = "$EXPECTED_SOURCE_SHA" || {
            echo "source checkout mismatch: expected=$EXPECTED_SOURCE_SHA actual=$actual_source_sha" >&2
            exit 1
          }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run package:smoke
      - run: npm run bundle:linux-x64
      - name: Clean install, upgrade, and uninstall Linux bundle
        shell: bash
        run: |
          acceptance_root="$(mktemp -d)"
          export RLSOK_RELEASE_DIR="$PWD/artifacts"
          export RLSOK_INSTALL_ROOT="$acceptance_root/opt/rlsok"
          export RLSOK_BIN_DIR="$acceptance_root/bin"
          export RLSOK_PYTHON_SITE="$acceptance_root/python-site"
          sh packaging/install.sh
          "$RLSOK_BIN_DIR/rlsok" --version
          "$RLSOK_BIN_DIR/rlsok" setup --help
          RLSOK_PYTHON_SITE="$RLSOK_PYTHON_SITE" python3 -c "import os, site; site.addsitedir(os.environ['RLSOK_PYTHON_SITE']); from rlsok import propose; assert callable(propose)"
          sh packaging/install.sh
          "$RLSOK_INSTALL_ROOT/uninstall.sh"
          test ! -e "$RLSOK_BIN_DIR/rlsok"
      - run: npm run sbom
      - run: npm run licenses
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: distribution-proof
          path: |
            artifacts/licenses.json
            artifacts/realitywarden-rlsok-*.tgz
            artifacts/realitywarden-rlsok-*.tgz.manifest.json
            artifacts/realitywarden-rlsok-*.tgz.sha256
            artifacts/rlsok-runtime-*-linux-x64.tar.gz
            artifacts/rlsok-runtime-*-linux-x64.tar.gz.sha256
            artifacts/rlsok.cdx.json
            packaging/install.sh
          if-no-files-found: error

  zero-to-shadow-freshness-clock-e2e:
    name: RUNTIME_ZERO_TO_SHADOW_FRESHNESS_CLOCK_E2E
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_source_sha="$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$actual_source_sha" = "$EXPECTED_SOURCE_SHA" || {
            echo "source checkout mismatch: expected=$EXPECTED_SOURCE_SHA actual=$actual_source_sha" >&2
            exit 1
          }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Initialize sanitized gate evidence
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          evidence_root="artifacts/zero-to-shadow-freshness-clock-e2e"
          mkdir -p "$evidence_root/samples"
          {
            echo "gate=RUNTIME_ZERO_TO_SHADOW_FRESHNESS_CLOCK_E2E"
            echo "source_sha=$EXPECTED_SOURCE_SHA"
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "github_event_name=$GITHUB_EVENT_NAME"
            echo "github_run_id=$GITHUB_RUN_ID"
            echo "github_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "kernel=$(uname -srvmo)"
            echo "command=node scripts/run-rlsok.cjs --test tests/setup/zeroToShadow.test.ts"
            echo "serial_samples=20"
            echo "parallel_rounds=10"
            echo "parallel_samples_per_round=2"
            echo "total_samples=40"
          } > "$evidence_root/environment.txt"
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: distribution-proof
          path: candidate
      - name: Prove the test clock is absent from production and distributions
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="artifacts/zero-to-shadow-freshness-clock-e2e"
          test_clock_pattern='sharedMonotonicClock|sharedMonotonicRos2Sidecar|RLSOK_TEST_SHARED_MONOTONIC|RLSOK_TEST_OBSERVATION_OFFSET_MS|test_clock_fixture_hardware_dispatch_forbidden|isolated-test-clock'

          mapfile -t unexpected_source_refs < <(
            git grep -l -E "$test_clock_pattern" -- . \
              ':(exclude).github/**' \
              ':(exclude)tests/**' || true
          )
          if (( ${#unexpected_source_refs[@]} != 0 )); then
            printf '%s\n' "${unexpected_source_refs[@]}" \
              | tee "$evidence_root/unexpected-production-source-references.txt"
            echo "test clock referenced outside test-only paths" >&2
            exit 1
          fi
          printf 'PASS: test clock references are confined to test-only paths\n' \
            > "$evidence_root/production-source-boundary.txt"

          npm run build
          if grep -R -I -l -E "$test_clock_pattern" dist \
            > "$evidence_root/unexpected-dist-references.txt"; then
            cat "$evidence_root/unexpected-dist-references.txt"
            echo "test clock found in dist" >&2
            exit 1
          fi
          printf 'PASS: test clock absent from dist\n' \
            > "$evidence_root/dist-boundary.txt"

          shopt -s nullglob
          npm_archives=(candidate/artifacts/*.tgz)
          linux_archives=(candidate/artifacts/*linux-x64.tar.gz)
          if (( ${#npm_archives[@]} != 1 || ${#linux_archives[@]} != 1 )); then
            printf 'expected one npm archive and one Linux archive; found npm=%s linux=%s\n' \
              "${#npm_archives[@]}" "${#linux_archives[@]}" >&2
            find candidate -maxdepth 3 -type f -print | sort
            exit 1
          fi

          extraction_root="$(mktemp -d)"
          trap 'rm -rf "$extraction_root"' EXIT
          for archive in "${npm_archives[@]}" "${linux_archives[@]}"; do
            archive_name="$(basename "$archive")"
            archive_id="${archive_name//[^A-Za-z0-9._-]/_}"
            archive_root="$extraction_root/$archive_id"
            mkdir -p "$archive_root"
            tar -tzf "$archive" > "$evidence_root/$archive_id.contents.txt"
            if grep -E -i "$test_clock_pattern" \
              "$evidence_root/$archive_id.contents.txt"; then
              echo "test clock path found in $archive_name" >&2
              exit 1
            fi
            tar -xzf "$archive" -C "$archive_root"
            if grep -R -I -l -E "$test_clock_pattern" "$archive_root" \
              > "$evidence_root/$archive_id.unexpected-references.txt"; then
              cat "$evidence_root/$archive_id.unexpected-references.txt"
              echo "test clock content found in $archive_name" >&2
              exit 1
            fi
            printf 'PASS: test clock absent from paths and contents\n' \
              > "$evidence_root/$archive_id.boundary.txt"
          done
      - name: Collect 20 serial and 20 parallel deterministic samples
        shell: bash
        run: |
          set +e
          set -u
          set -o pipefail
          evidence_root="artifacts/zero-to-shadow-freshness-clock-e2e"
          samples_root="$evidence_root/samples"
          test_command=(
            node
            scripts/run-rlsok.cjs
            --test
            tests/setup/zeroToShadow.test.ts
          )

          run_sample() {
            sample_id="$1"
            sample_root="$samples_root/$sample_id"
            mkdir -p "$sample_root"
            date -u +%Y-%m-%dT%H:%M:%S.%3NZ > "$sample_root/started-at.txt"
            started_ms="$(date -u +%s%3N)"
            "${test_command[@]}" \
              > "$sample_root/stdout.log" \
              2> "$sample_root/stderr.log"
            exit_code=$?
            ended_ms="$(date -u +%s%3N)"
            date -u +%Y-%m-%dT%H:%M:%S.%3NZ > "$sample_root/finished-at.txt"
            printf '%s\n' "$exit_code" > "$sample_root/exit-code.txt"
            printf '%s\n' "$((ended_ms - started_ms))" > "$sample_root/duration-ms.txt"
          }

          for serial_index in $(seq -w 1 20); do
            run_sample "serial-$serial_index"
          done

          for parallel_round in $(seq -w 1 10); do
            run_sample "parallel-$parallel_round-a" &
            first_pid=$!
            run_sample "parallel-$parallel_round-b" &
            second_pid=$!
            wait "$first_pid"
            wait "$second_pid"
          done

          printf 'sample\texit_code\tnormal_marker\tfuture_marker\tstale_marker\tresult\n' \
            > "$evidence_root/summary.tsv"
          mapfile -t sample_roots < <(find "$samples_root" -mindepth 1 -maxdepth 1 -type d | sort)
          gate_failures=0
          if (( ${#sample_roots[@]} != 40 )); then
            echo "expected 40 samples, found ${#sample_roots[@]}" >&2
            gate_failures=$((gate_failures + 1))
          fi
          for sample_root in "${sample_roots[@]}"; do
            sample_id="$(basename "$sample_root")"
            exit_code="missing"
            test ! -f "$sample_root/exit-code.txt" \
              || exit_code="$(cat "$sample_root/exit-code.txt")"
            normal_marker=0
            future_marker=0
            stale_marker=0
            grep -Fqx 'ok - zero-to-shadow acceptance' "$sample_root/stdout.log" \
              && normal_marker=1
            grep -Fqx 'ok - zero-to-shadow future observation blocked before dispatch' \
              "$sample_root/stdout.log" && future_marker=1
            grep -Fqx 'ok - zero-to-shadow stale observation blocked before dispatch' \
              "$sample_root/stdout.log" && stale_marker=1
            sample_result=PASS
            if [[ "$exit_code" != 0 \
              || "$normal_marker" != 1 \
              || "$future_marker" != 1 \
              || "$stale_marker" != 1 ]]; then
              sample_result=FAIL
              gate_failures=$((gate_failures + 1))
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$sample_id" \
              "$exit_code" \
              "$normal_marker" \
              "$future_marker" \
              "$stale_marker" \
              "$sample_result" \
              >> "$evidence_root/summary.tsv"
          done
          printf 'samples_collected=%s\nfailures=%s\n' \
            "${#sample_roots[@]}" "$gate_failures" \
            > "$evidence_root/gate-result.txt"
          cat "$evidence_root/summary.tsv"
          cat "$evidence_root/gate-result.txt"
          if (( gate_failures != 0 )); then
            exit 1
          fi
      - name: Upload sanitized deterministic freshness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sanitized-zero-to-shadow-freshness-clock-e2e
          path: artifacts/zero-to-shadow-freshness-clock-e2e
          if-no-files-found: error

  ros2-jazzy-dds:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_source_sha="$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$actual_source_sha" = "$EXPECTED_SOURCE_SHA" || {
            echo "source checkout mismatch: expected=$EXPECTED_SOURCE_SHA actual=$actual_source_sha" >&2
            exit 1
          }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ros-jazzy-control-msgs \
            ros-jazzy-ros2controlcli \
            ros-jazzy-ur \
            ros-jazzy-sensor-msgs \
            ros-jazzy-std-msgs \
            ros-jazzy-trajectory-msgs
          rm -rf /var/lib/apt/lists/*
      - shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          npm ci
          python3 experimental/ros2-reference-sidecar/rlsok_ros2_sidecar.py --doctor
          npm run ros2:test
          npm run ros2:dds-test
      - name: Validate automatic UR5e integration against the official driver
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          # Isolate this long-lived official-driver graph from the preceding
          # short-lived DDS fixtures and force a fresh discovery participant.
          export ROS_DOMAIN_ID=77
          export RMW_IMPLEMENTATION=rmw_fastrtps_cpp
          ros2 daemon stop >/dev/null 2>&1 || true
          ros2 launch ur_robot_driver ur_control.launch.py \
            ur_type:=ur5e \
            robot_ip:=127.0.0.1 \
            use_mock_hardware:=true \
            initial_joint_controller:=scaled_joint_trajectory_controller \
            launch_rviz:=false \
            > /tmp/ur5e-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" 2>/dev/null || true' EXIT
          controller_ready=false
          for attempt in $(seq 1 60); do
            if grep -q "Configured and activated scaled_joint_trajectory_controller" /tmp/ur5e-driver.log \
              && timeout 3 ros2 action list 2>/dev/null \
                | grep -qx '/scaled_joint_trajectory_controller/follow_joint_trajectory'; then
              controller_ready=true
              break
            fi
            sleep 1
          done
          if [ "$controller_ready" != true ]; then
            cat /tmp/ur5e-driver.log
            exit 1
          fi
          RLSOK_OFFICIAL_UR5E_TEST=1 npm run test:official-ur5e || {
            cat /tmp/ur5e-driver.log
            exit 1
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sanitized-ros2-dds-evidence
          path: artifacts/ros2-dds/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: official-ur5e-integration-proof
          path: artifacts/official-ur5e-integration.json
          if-no-files-found: error

  first-user-installed-ur5e:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_source_sha="$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$actual_source_sha" = "$EXPECTED_SOURCE_SHA" || {
            echo "source checkout mismatch: expected=$EXPECTED_SOURCE_SHA actual=$actual_source_sha" >&2
            exit 1
          }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: distribution-proof
          path: candidate
      - name: Install acceptance dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl \
            ros-jazzy-control-msgs \
            ros-jazzy-ur \
            ros-jazzy-sensor-msgs \
            ros-jazzy-std-msgs \
            ros-jazzy-trajectory-msgs
          rm -rf /var/lib/apt/lists/*
          npm ci
      - name: Public-to-candidate install, failure recovery, and uninstall acceptance
        shell: bash
        env:
          RLSOK_RELEASE_DIR: ${{ github.workspace }}/candidate/artifacts
          RLSOK_CANDIDATE_INSTALLER: ${{ github.workspace }}/candidate/packaging/install.sh
          RLSOK_INSTALL_ACCEPTANCE_PROOF: ${{ github.workspace }}/artifacts/first-user-install-acceptance.json
        run: bash scripts/first-user-install-acceptance.sh
      - name: Install candidate bundle for live Zero-to-Shadow
        shell: bash
        run: |
          acceptance_root=$(mktemp -d)
          echo "RLSOK_LIVE_ACCEPTANCE_ROOT=$acceptance_root" >> "$GITHUB_ENV"
          RLSOK_RELEASE_DIR="$GITHUB_WORKSPACE/candidate/artifacts" \
          RLSOK_INSTALL_ROOT="$acceptance_root/opt/rlsok" \
          RLSOK_BIN_DIR="$acceptance_root/bin" \
          RLSOK_PYTHON_SITE="$acceptance_root/python-site" \
            sh "$GITHUB_WORKSPACE/candidate/packaging/install.sh"
      - name: Launch official UR5e driver mock hardware
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          export ROS_DOMAIN_ID=91
          export RMW_IMPLEMENTATION=rmw_fastrtps_cpp
          echo "ROS_DOMAIN_ID=$ROS_DOMAIN_ID" >> "$GITHUB_ENV"
          ros2 daemon stop >/dev/null 2>&1 || true
          ros2 launch ur_robot_driver ur_control.launch.py \
            ur_type:=ur5e \
            robot_ip:=127.0.0.1 \
            use_mock_hardware:=true \
            initial_joint_controller:=scaled_joint_trajectory_controller \
            launch_rviz:=false \
            > /tmp/first-user-ur5e-driver.log 2>&1 &
          echo "RLSOK_UR5E_DRIVER_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if grep -q "Configured and activated scaled_joint_trajectory_controller" /tmp/first-user-ur5e-driver.log \
              && timeout 3 ros2 action list 2>/dev/null \
                | grep -qx '/scaled_joint_trajectory_controller/follow_joint_trajectory'; then
              if timeout 3 ros2 topic echo --once --qos-reliability best_effort \
                /joint_states sensor_msgs/msg/JointState >/dev/null 2>&1; then
                exit 0
              fi
            fi
            sleep 1
          done
          cat /tmp/first-user-ur5e-driver.log
          exit 1
      - name: Run installed-bundle live UR5e Zero-to-Shadow
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          export RMW_IMPLEMENTATION=rmw_fastrtps_cpp
          export RLSOK_UR_DRIVER_VERSION="$(dpkg-query -W -f='${Version}' ros-jazzy-ur-robot-driver)"
          export RLSOK_INSTALLED_CLI="$RLSOK_LIVE_ACCEPTANCE_ROOT/bin/rlsok"
          export RLSOK_SETUP_LIVE_DISCOVERY=1
          export RLSOK_ACCEPTANCE_PROOF="$GITHUB_WORKSPACE/artifacts/first-user-zero-to-shadow.json"
          npm run test:setup || {
            cat /tmp/first-user-ur5e-driver.log
            source /opt/ros/jazzy/setup.bash
            ros2 topic list -t || true
            ros2 action list -t || true
            ros2 control list_controllers || true
            exit 1
          }
      - name: Stop acceptance graph
        if: always()
        shell: bash
        run: |
          kill "${RLSOK_UR5E_DRIVER_PID:-}" 2>/dev/null || true
      - name: Upload first-user acceptance proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: first-user-acceptance-proof
          path: |
            artifacts/first-user-install-acceptance.json
            artifacts/first-user-zero-to-shadow.json
            artifacts/first-user-recovery-matrix.json
          if-no-files-found: error

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact source checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_source_sha="$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$actual_source_sha" = "$EXPECTED_SOURCE_SHA" || {
            echo "source checkout mismatch: expected=$EXPECTED_SOURCE_SHA actual=$actual_source_sha" >&2
            exit 1
          }
      - name: Install pinned Gitleaks CLI
        run: go install github.com/zricethezav/gitleaks/v8@v8.28.0
      - run: |
          "$(go env GOPATH)/bin/gitleaks" detect --source=. --no-banner --redact

  windows-package-smoke:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_source_sha="$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$actual_source_sha" = "$EXPECTED_SOURCE_SHA" || {
            echo "source checkout mismatch: expected=$EXPECTED_SOURCE_SHA actual=$actual_source_sha" >&2
            exit 1
          }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Package and CLI acceptance
        run: npm run package:smoke
