name: RLSOK core

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  default:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
