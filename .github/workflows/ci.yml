name: RLSOK core

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run package:smoke
      - run: npm run bundle:linux-x64
      - name: Clean install, upgrade, and uninstall Linux bundle
        shell: bash
        run: |
          acceptance_root="$(mktemp -d)"
          export RLSOK_RELEASE_DIR="$PWD/artifacts"
          export RLSOK_INSTALL_ROOT="$acceptance_root/opt/rlsok"
          export RLSOK_BIN_DIR="$acceptance_root/bin"
          export RLSOK_PYTHON_SITE="$acceptance_root/python-site"
          sh packaging/install.sh
          "$RLSOK_BIN_DIR/rlsok" --version
          "$RLSOK_BIN_DIR/rlsok" setup --help
          RLSOK_PYTHON_SITE="$RLSOK_PYTHON_SITE" python3 -c "import os, site; site.addsitedir(os.environ['RLSOK_PYTHON_SITE']); from rlsok import propose; assert callable(propose)"
          sh packaging/install.sh
          "$RLSOK_INSTALL_ROOT/uninstall.sh"
          test ! -e "$RLSOK_BIN_DIR/rlsok"
      - run: npm run sbom
      - run: npm run licenses
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: distribution-proof
          path: |
            artifacts/*.tgz
            artifacts/*linux-x64.tar.gz
            artifacts/*linux-x64.tar.gz.sha256
            artifacts/*.sha256
            artifacts/*.json
            packaging/install.sh

  ros2-jazzy-dds:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ros-jazzy-control-msgs \
            ros-jazzy-ros2controlcli \
            ros-jazzy-ur \
            ros-jazzy-sensor-msgs \
            ros-jazzy-std-msgs \
            ros-jazzy-trajectory-msgs
          rm -rf /var/lib/apt/lists/*
      - shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          npm ci
          python3 experimental/ros2-reference-sidecar/rlsok_ros2_sidecar.py --doctor
          npm run ros2:test
          npm run ros2:dds-test
      - name: Validate automatic UR5e integration against the official driver
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          # Isolate this long-lived official-driver graph from the preceding
          # short-lived DDS fixtures and force a fresh discovery participant.
          export ROS_DOMAIN_ID=77
          ros2 daemon stop >/dev/null 2>&1 || true
          ros2 launch ur_robot_driver ur_control.launch.py \
            ur_type:=ur5e \
            robot_ip:=127.0.0.1 \
            use_mock_hardware:=true \
            initial_joint_controller:=scaled_joint_trajectory_controller \
            launch_rviz:=false \
            > /tmp/ur5e-driver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" 2>/dev/null || true' EXIT
          controller_ready=false
          for attempt in $(seq 1 40); do
            if grep -q "Configured and activated scaled_joint_trajectory_controller" /tmp/ur5e-driver.log; then
              controller_ready=true
              break
            fi
            sleep 1
          done
          if [ "$controller_ready" != true ]; then
            cat /tmp/ur5e-driver.log
            exit 1
          fi
          RLSOK_OFFICIAL_UR5E_TEST=1 npm run test:official-ur5e || {
            cat /tmp/ur5e-driver.log
            exit 1
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sanitized-ros2-dds-evidence
          path: artifacts/ros2-dds/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: official-ur5e-integration-proof
          path: artifacts/official-ur5e-integration.json

  first-user-installed-ur5e:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: distribution-proof
          path: candidate
      - name: Install acceptance dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl \
            ros-jazzy-control-msgs \
            ros-jazzy-ur \
            ros-jazzy-sensor-msgs \
            ros-jazzy-std-msgs \
            ros-jazzy-trajectory-msgs
          rm -rf /var/lib/apt/lists/*
          npm ci
      - name: Public-to-candidate install, failure recovery, and uninstall acceptance
        shell: bash
        env:
          RLSOK_RELEASE_DIR: ${{ github.workspace }}/candidate/artifacts
          RLSOK_CANDIDATE_INSTALLER: ${{ github.workspace }}/candidate/packaging/install.sh
          RLSOK_INSTALL_ACCEPTANCE_PROOF: ${{ github.workspace }}/artifacts/first-user-install-acceptance.json
        run: bash scripts/first-user-install-acceptance.sh
      - name: Install candidate bundle for live Zero-to-Shadow
        shell: bash
        run: |
          acceptance_root=$(mktemp -d)
          echo "RLSOK_LIVE_ACCEPTANCE_ROOT=$acceptance_root" >> "$GITHUB_ENV"
          RLSOK_RELEASE_DIR="$GITHUB_WORKSPACE/candidate/artifacts" \
          RLSOK_INSTALL_ROOT="$acceptance_root/opt/rlsok" \
          RLSOK_BIN_DIR="$acceptance_root/bin" \
          RLSOK_PYTHON_SITE="$acceptance_root/python-site" \
            sh "$GITHUB_WORKSPACE/candidate/packaging/install.sh"
      - name: Launch official UR5e driver mock hardware
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          export ROS_DOMAIN_ID=91
          echo "ROS_DOMAIN_ID=$ROS_DOMAIN_ID" >> "$GITHUB_ENV"
          ros2 daemon stop >/dev/null 2>&1 || true
          ros2 launch ur_robot_driver ur_control.launch.py \
            ur_type:=ur5e \
            robot_ip:=127.0.0.1 \
            use_mock_hardware:=true \
            initial_joint_controller:=scaled_joint_trajectory_controller \
            launch_rviz:=false \
            > /tmp/first-user-ur5e-driver.log 2>&1 &
          echo "RLSOK_UR5E_DRIVER_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 40); do
            if grep -q "Configured and activated scaled_joint_trajectory_controller" /tmp/first-user-ur5e-driver.log; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/first-user-ur5e-driver.log
          exit 1
      - name: Run installed-bundle live UR5e Zero-to-Shadow
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          export RMW_IMPLEMENTATION=rmw_fastrtps_cpp
          export RLSOK_UR_DRIVER_VERSION="$(dpkg-query -W -f='${Version}' ros-jazzy-ur-robot-driver)"
          export RLSOK_INSTALLED_CLI="$RLSOK_LIVE_ACCEPTANCE_ROOT/bin/rlsok"
          export RLSOK_SETUP_LIVE_DISCOVERY=1
          export RLSOK_ACCEPTANCE_PROOF="$GITHUB_WORKSPACE/artifacts/first-user-zero-to-shadow.json"
          npm run test:setup || {
            cat /tmp/first-user-ur5e-driver.log
            source /opt/ros/jazzy/setup.bash
            ros2 topic list -t || true
            ros2 action list -t || true
            ros2 control list_controllers || true
            exit 1
          }
      - name: Stop acceptance graph
        if: always()
        shell: bash
        run: |
          kill "${RLSOK_UR5E_DRIVER_PID:-}" 2>/dev/null || true
      - name: Upload first-user acceptance proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: first-user-acceptance-proof
          path: |
            artifacts/first-user-install-acceptance.json
            artifacts/first-user-zero-to-shadow.json
            artifacts/first-user-recovery-matrix.json
          if-no-files-found: error

  first-user-installed-actual-cloud-ur5e:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container: ros:jazzy-ros-base
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rlsok_acceptance
          POSTGRES_PASSWORD: isolated-acceptance-password
          POSTGRES_DB: rlsok_acceptance
        options: >-
          --health-cmd "pg_isready -U rlsok_acceptance -d rlsok_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://rlsok_acceptance:isolated-acceptance-password@postgres:5432/rlsok_acceptance
      RLSOK_CLOUD_SOURCE_COMMIT: b79364b86d57e665d4e0c74eb4bbf0a2a8567b75
      RLSOK_CLOUD_ORGANIZATION: phase2-acceptance
      RLSOK_CLOUD_ADMIN_EMAIL: phase2-admin@rlsok.invalid
      RLSOK_CLOUD_ADMIN_PASSWORD: Phase2-isolated-password-12345
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: realitywarden/rlsok-cloud
          ref: b79364b86d57e665d4e0c74eb4bbf0a2a8567b75
          path: isolated-cloud
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: distribution-proof
          path: candidate
      - name: Install candidate and isolated Cloud dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl \
            ros-jazzy-control-msgs \
            ros-jazzy-ros2controlcli \
            ros-jazzy-ur \
            ros-jazzy-sensor-msgs \
            ros-jazzy-std-msgs \
            ros-jazzy-trajectory-msgs
          rm -rf /var/lib/apt/lists/*
          npm ci
          npm ci --prefix isolated-cloud
          npm run build --prefix isolated-cloud
          acceptance_root=$(mktemp -d)
          echo "RLSOK_LIVE_ACCEPTANCE_ROOT=$acceptance_root" >> "$GITHUB_ENV"
          RLSOK_RELEASE_DIR="$GITHUB_WORKSPACE/candidate/artifacts" \
          RLSOK_INSTALL_ROOT="$acceptance_root/opt/rlsok" \
          RLSOK_BIN_DIR="$acceptance_root/bin" \
          RLSOK_PYTHON_SITE="$acceptance_root/python-site" \
            sh "$GITHUB_WORKSPACE/candidate/packaging/install.sh"
      - name: Migrate and start the actual isolated Cloud API
        shell: bash
        run: |
          npm run db:migrate --prefix isolated-cloud
          ORG_NAME="$RLSOK_CLOUD_ORGANIZATION" \
          USER_EMAIL="$RLSOK_CLOUD_ADMIN_EMAIL" \
          USER_DISPLAY_NAME=phase2-pairing-administrator \
          USER_ROLE=administrator \
          USER_PASSWORD="$RLSOK_CLOUD_ADMIN_PASSWORD" \
            npm run admin:create-user --prefix isolated-cloud
          ORG_NAME="$RLSOK_CLOUD_ORGANIZATION" \
          API_KEY_LABEL=phase2-independent-approver \
          PRINCIPAL_ROLE=approver \
          PRINCIPAL_DISPLAY_LABEL=phase2-independent-approver \
          API_KEY_OUTPUT_FILE="$GITHUB_WORKSPACE/phase2-approver.key" \
            npm run admin:create-api-key --prefix isolated-cloud
          (
            cd isolated-cloud
            HOST=0.0.0.0 PORT=8080 LOG_LEVEL=warn \
            PUBLIC_WEB_ORIGIN=http://127.0.0.1:8080 \
              npm run start --workspace @rlsok/api
          ) > /tmp/phase2-cloud.log 2>&1 &
          echo "RLSOK_CLOUD_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/phase2-cloud.log
          exit 1
      - name: Launch official UR5e Jazzy mock-hardware graph
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          export ROS_DOMAIN_ID=92
          echo "ROS_DOMAIN_ID=$ROS_DOMAIN_ID" >> "$GITHUB_ENV"
          ros2 daemon stop >/dev/null 2>&1 || true
          ros2 launch ur_robot_driver ur_control.launch.py \
            ur_type:=ur5e \
            robot_ip:=127.0.0.1 \
            use_mock_hardware:=true \
            initial_joint_controller:=scaled_joint_trajectory_controller \
            launch_rviz:=false \
            > /tmp/phase2-ur5e-driver.log 2>&1 &
          echo "RLSOK_UR5E_DRIVER_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 40); do
            if grep -q "Configured and activated scaled_joint_trajectory_controller" /tmp/phase2-ur5e-driver.log; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/phase2-ur5e-driver.log
          exit 1
      - name: Pair, independently approve, Permit, Shadow, and verify Evidence
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          export RMW_IMPLEMENTATION=rmw_fastrtps_cpp
          export RLSOK_INSTALLED_CLI="$RLSOK_LIVE_ACCEPTANCE_ROOT/bin/rlsok"
          export RLSOK_CLOUD_API_URL=http://127.0.0.1:8080
          export RLSOK_CLOUD_APPROVER_KEY="$(cat "$GITHUB_WORKSPACE/phase2-approver.key")"
          export RLSOK_REAL_CLOUD_ACCEPTANCE_PROOF="$GITHUB_WORKSPACE/artifacts/first-user-real-cloud-zero-to-shadow.json"
          npm run test:setup-real-cloud || {
            cat /tmp/phase2-cloud.log
            cat /tmp/phase2-ur5e-driver.log
            ros2 topic list -t || true
            ros2 action list -t || true
            ros2 control list_controllers || true
            exit 1
          }
      - name: Stop isolated acceptance services
        if: always()
        shell: bash
        run: |
          kill "${RLSOK_UR5E_DRIVER_PID:-}" 2>/dev/null || true
          kill "${RLSOK_CLOUD_PID:-}" 2>/dev/null || true
      - name: Upload actual isolated-Cloud acceptance proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: first-user-real-cloud-acceptance-proof
          path: artifacts/first-user-real-cloud-zero-to-shadow.json
          if-no-files-found: error

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks CLI
        run: go install github.com/zricethezav/gitleaks/v8@v8.28.0
      - run: |
          "$(go env GOPATH)/bin/gitleaks" detect --source=. --no-banner --redact

  windows-package-smoke:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Package and CLI acceptance
        run: npm run package:smoke
