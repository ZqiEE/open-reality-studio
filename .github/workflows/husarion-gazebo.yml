name: Husarion ROSbot Gazebo acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/husarion-gazebo.yml'
      - 'apps/demo/husarion-rosbot-gazebo.ts'
      - 'examples/husarion-rosbot-gazebo/**'
      - 'experimental/husarion-rosbot-gazebo/**'
      - 'packages/core/execution-gate.ts'
      - 'packages/husarion-rosbot-gazebo/**'
      - 'scripts/husarion-gazebo-*'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-gazebo:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: ros:jazzy-ros-base
    env:
      HUSARION_COMMIT: 7c7bfa449011905be63442b6c0ca98b35131cabc
      HUSARION_WS: /tmp/rosbot_ws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_source_sha="$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$actual_source_sha" = "$EXPECTED_SOURCE_SHA" || {
            echo "source checkout mismatch: expected=$EXPECTED_SOURCE_SHA actual=$actual_source_sha" >&2
            exit 1
          }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install official workspace tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git jq python3-pip ros-dev-tools
          rm -rf /var/lib/apt/lists/*
      - name: Import pinned official Husarion workspace
        shell: bash
        run: |
          mkdir -p "$HUSARION_WS/src"
          git clone --filter=blob:none --no-checkout https://github.com/husarion/rosbot_ros.git \
            "$HUSARION_WS/src/rosbot_ros"
          git -C "$HUSARION_WS/src/rosbot_ros" checkout --detach "$HUSARION_COMMIT"
          test "$(git -C "$HUSARION_WS/src/rosbot_ros" rev-parse HEAD)" = "$HUSARION_COMMIT"
          source /opt/ros/jazzy/setup.bash
          # Follow the pinned upstream Dockerfile.simulation exactly: import
          # the simulation manifest and omit its hardware-only bringup package.
          vcs import "$HUSARION_WS/src" \
            < "$HUSARION_WS/src/rosbot_ros/rosbot/rosbot_simulation.repos"
          rm -rf "$HUSARION_WS/src/rosbot_ros/rosbot_bringup"
      - name: Resolve official dependencies
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          export PIP_BREAK_SYSTEM_PACKAGES=1
          apt-get update
          rosdep init 2>/dev/null || true
          rosdep update --rosdistro jazzy
          rosdep install -i --from-path "$HUSARION_WS/src" --rosdistro jazzy -y
      - name: Build pinned official workspace
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd "$HUSARION_WS"
          colcon build --symlink-install --packages-up-to rosbot_gazebo \
            --event-handlers console_cohesion+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release
      - name: Install and build RLSOK
        run: |
          npm ci
          npm run build
      - name: Run real headless Gazebo acceptance
        shell: bash
        run: bash scripts/husarion-gazebo-acceptance.sh
      - name: Upload acceptance diagnostics and Evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: husarion-gazebo-acceptance-proof
          path: artifacts/husarion-gazebo
          if-no-files-found: error
