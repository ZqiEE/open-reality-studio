name: ROS 2 reference environment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/ros2-reference-gateway/**"
      - "experimental/ros2-reference-sidecar/**"
      - "tests/ros2-reference/**"
      - ".github/workflows/ros2-reference.yml"

jobs:
  jazzy-doctor:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install reference message/action packages
        run: |
          apt-get update
          apt-get install -y ros-jazzy-control-msgs ros-jazzy-sensor-msgs
      - name: Verify rclpy transport imports and report graph state
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 experimental/ros2-reference-sidecar/rlsok_ros2_sidecar.py --doctor

      # This job validates ROS imports and an honest empty-graph doctor report.
      # Physical controller, DDS timing, SROS2, and cancellation validation
      # remain design-partner runbook work and are never inferred from CI.
